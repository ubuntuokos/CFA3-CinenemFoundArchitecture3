name: CFA3 Qt 6.8 Linux environment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfa3-qt68-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qt68-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out CFA3
        uses: actions/checkout@v4

      - name: Install C++ build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgl1-mesa-dev

      - name: Install Qt 6.8 desktop SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: linux
          target: desktop
          install-deps: 'true'
          cache: 'false'

      - name: Verify Qt 6.8 Widgets and Quick/QML with CMake
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cfa3-qt68-smoke"
          cat > "$RUNNER_TEMP/cfa3-qt68-smoke/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.21)
          project(CFA3Qt68Smoke LANGUAGES CXX)
          find_package(Qt6 6.8 REQUIRED COMPONENTS Core Widgets Qml Quick)
          if(Qt6_VERSION VERSION_LESS "6.8.0" OR NOT Qt6_VERSION VERSION_LESS "6.9.0")
            message(FATAL_ERROR "Qt 6.8.x required; found ${Qt6_VERSION}")
          endif()
          message(STATUS "CFA3 Qt SDK verified: ${Qt6_VERSION}")
          add_executable(cfa3-qt68-smoke main.cpp)
          target_link_libraries(cfa3-qt68-smoke PRIVATE Qt6::Widgets Qt6::Qml Qt6::Quick)
          CMAKE
          cat > "$RUNNER_TEMP/cfa3-qt68-smoke/main.cpp" <<'CPP'
          #include <QApplication>
          #include <QQmlEngine>
          #include <QQuickItem>
          #include <QWidget>
          #include <QtGlobal>

          int main(int argc, char **argv) {
              QApplication app(argc, argv);
              QWidget widget;
              QQmlEngine qml;
              QQuickItem quick;
              return (QT_VERSION_MAJOR == 6 && QT_VERSION_MINOR == 8 &&
                      widget.isWidgetType()) ? 0 : 1;
          }
          CPP
          cmake -S "$RUNNER_TEMP/cfa3-qt68-smoke" \
            -B "$RUNNER_TEMP/cfa3-qt68-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build "$RUNNER_TEMP/cfa3-qt68-build" --parallel 2
          "$RUNNER_TEMP/cfa3-qt68-build/cfa3-qt68-smoke"

      - name: Evidence boundary
        run: echo "Qt SDK reference CI only; not a physical Current Host or GUI integration PASS"
