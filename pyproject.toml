[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "cfa3-current-host"
version = "0.1.0"
description = "CFA3 native Current Host and community plugin host interfaces (not runtime admitted)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6,<7"]

[project.scripts]
cfa3-current-host = "cfa3_current_host.__main__:main"

[tool.setuptools.packages.find]
include = ["cfa3_current_host*"]
exclude = ["tests*", "archive*"]
