# Hosted CI is only a reproducible *reference* check.
# Never claim this run as CFA3 physical Current Host or Foundation PASS.
name: CFA3 Current Host reference checks
on:
  push:
    branches:
      - feat/current-host-plugin-fabric-20261010
    paths:
      - 'cfa3_current_host/**'
      - 'crates/cfa3-current-host/**'
      - 'tests/test_current_host*.py'
      - '.github/workflows/current-host-reference.yml'
      - 'Cargo.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cfa3-current-host-reference-${{ github.ref }}
  cancel-in-progress: false
jobs:
  python-current-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate new CFA3 baseline contracts
        run: python scripts/check_bootstrap.py
      - name: Verify source syntax
        run: python -m compileall -q cfa3_current_host tests
      - name: Test entire new CFA3 Python workspace
        run: python -m unittest discover -s tests -v
      - name: Reference evidence boundary
        if: always()
        run: echo "Hosted CI result is not physical Current Host PASS"
  rust-current-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify native CFA3 Rust workspace including Current Host
        run: cargo test --workspace
      - name: Reference evidence boundary
        if: always()
        run: echo "Rust reference tests do not issue Current Host physical PASS"

  qt6-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Provide required Linux Qt6 graphics runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - name: Install Qt6 Widgets essentials for reference test only
        run: python -m pip install --disable-pip-version-check "PySide6-Essentials>=6.8,<7"
      - name: Run real Qt6 dashboard widget tests
        run: python -m unittest discover -s tests -p 'test_current_host_qt6.py' -v
      - name: Verify Qt6 actual widget containment and pending evidence
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication, QWidget
          from cfa3_current_host.core import Component, Graph, Ownership
          from cfa3_current_host.qt6_dashboard import CurrentHostDashboard
          app = QApplication([])
          graph = Graph()
          graph.register_component(Component("platform", "FOUNDATION", "rev1", Ownership.CFA3_COMPONENT))
          graph.register_component(Component("editor", "VIDEO", "rev1", Ownership.CFA3_COMPONENT,
                                             gui=True, parent_id="platform"))
          plan = graph.plan(["editor"])
          parent = QWidget()
          panel = CurrentHostDashboard(plan, workload_mode="REFERENCE_UNKNOWN", parent=parent)
          assert panel.parent() is parent
          assert panel.integrated_with_actual_parent
          assert panel.tabs.count() == 4
          assert "REFERENCE_UNKNOWN" in panel.workload_indicator.text()
          layer = panel.tabs.widget(1)
          table = layer.findChild(__import__("PySide6.QtWidgets", fromlist=["QTableWidget"]).QTableWidget)
          assert table is not None and table.rowCount() == len(plan.obligations)
          assert all(table.item(i, 3).text() == "PENDING" for i in range(table.rowCount()))
          panel.close()
          parent.close()
          print("Qt6 reference widget mounted, evidence remains PENDING.")
          PY
      - name: Never promote hosted GUI reference to physical PASS
        if: always()
        run: echo "Qt6 offscreen widget reference is not standalone/parent physical Current Host PASS"

  real-bubblewrap-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux namespace isolation tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          command -v bwrap
      - name: Execute admitted-test-fixture plugin inside real Linux bubblewrap
        run: |
          python - <<'PY'
          import io
          import json
          import tempfile
          from pathlib import Path
          from zipfile import ZipFile
          from cfa3_current_host.plugin_fabric import Registry, State
          from cfa3_current_host.plugin_sandbox import execute_plugin_cpu
          from cfa3_current_host.foundation_runtime import (
              CpuResourceBroker, FoundationRuntime, Mode, ModelRouter,
              Request, RightsAuthority, SecurityAuthority, WorkloadModeBroker,
          )

          class ReferenceRightsOnly:
              def verify_plugin_admission(self, report):
                  return True
          class ReferenceSandboxOnly:
              def verify_runtime_isolation(self, report, package):
                  return package.is_file()

          publisher = "CFA3 CI reference fixture only"
          manifest = {
              "plugin_id": "com.cfa3.ci-isolation", "version": "1.0.0",
              "publisher": publisher, "license": "MIT", "api": "cfa3-plugin/v1",
              "apps": ["cfa3.video"], "capabilities": [],
              "permissions": ["plugin.run"], "dependencies": [], "gui": False,
          }
          source = io.BytesIO()
          with ZipFile(source, "w") as archive:
              archive.writestr("manifest.json", json.dumps(manifest))
              archive.writestr(
                  "plugin/main.py",
                  'import os\nassert not os.path.exists("/etc/passwd")\nprint("CFA3_REAL_BWRAP_REFERENCE")\n',
              )
          with tempfile.TemporaryDirectory(prefix="cfa3-bwrap-reference-") as temporary:
              registry = Registry(Path(temporary))
              report = registry.inspect(source.getvalue())
              registry.admit(manifest["plugin_id"], manifest["version"], ReferenceRightsOnly())
              registry.install(manifest["plugin_id"], manifest["version"], source.getvalue())
              registry.enable(manifest["plugin_id"], manifest["version"], ReferenceSandboxOnly())
              foundation = FoundationRuntime(
                  security=SecurityAuthority([(
                      publisher, "cfa3.plugin-host", "plugin.execute",
                      "cfa3.community-plugin.run"
                  )]),
                  rights=RightsAuthority([report.bundle_digest]),
                  model_router=ModelRouter(),
                  hrb=CpuResourceBroker(1),
                  modes=WorkloadModeBroker(),
              )
              session = foundation.start(Request(
                  actor=publisher, component="cfa3.plugin-host",
                  operation="plugin.execute", capability="cfa3.community-plugin.run",
                  artifact_digest=report.bundle_digest, cpu_threads=1,
                  mode=Mode.INTERACTIVE, ttl_seconds=30,
              ))
              observed = execute_plugin_cpu(
                  registry, manifest["plugin_id"], manifest["version"],
                  foundation=foundation, session=session,
                  entrypoint="plugin/main.py", timeout_seconds=10,
              )
              assert observed["status"] == "ISOLATED_EXECUTION_OBSERVED", observed
              assert observed["stdout"].strip() == "CFA3_REAL_BWRAP_REFERENCE", observed
              assert observed["physical_current_host_pass"] is False
              assert foundation.hrb.allocated == 0
              assert foundation.modes.indicator == "NONE"
              registry.disable(manifest["plugin_id"], manifest["version"])
              registry.remove(manifest["plugin_id"], manifest["version"])
              assert registry.state(manifest["plugin_id"], manifest["version"]) == State.REMOVED
              print("Real bubblewrap reference execution observed; physical acceptance PENDING.")
          PY
      - name: Hosted sandbox is not production certification
        if: always()
        run: echo "The Linux sandbox CI fixture does not verify a real user's physical Current Host."
