name: CFA3 bootstrap reference checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cfa3-bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact PR task identity, scope, rule status and cross-PR collision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_task_integrity.py
      - name: Reject oversized new or modified donor data files
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python3 scripts/check_donor_file_size.py --base "origin/$GITHUB_BASE_REF"
          else
            python3 scripts/check_donor_file_size.py --base HEAD^
          fi
      - name: Validate new-CFA3 bootstrap candidate policies
        run: python3 scripts/check_bootstrap.py
      - name: Verify full current canonical policy JSON surface
        run: python3 scripts/check_guard_policy_surface.py
      - name: Verify actual main-protection required checks and no bypass
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_execution_guard_ruleset.py --ci-visible
      - name: Verify owner-supplied normative text with all owner-admitted historical provisions
        run: python3 scripts/check_execution_guard_rule_spec.py
      - name: Validate 82 owner-admitted rule identities without forcing conditional runtime incidents
        run: python3 scripts/check_execution_rule_evidence.py --bootstrap-report
      - name: Run positive and negative structural tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify Rust-first contract workspace
        run: cargo test --workspace
      - name: Evidence boundary
        run: echo "Reference CI only; never physical Current Host or Foundation PASS"
