name: CFA3 portable Qt6 runtime reference

on:
  push:
    branches: [feat/portable-qt6-runtime-broker-20261010]
    paths:
      - 'cfa3_runtime/**'
      - 'tests/test_portable_runtime*.py'
      - '.github/workflows/portable-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfa3-portable-runtime-reference
  cancel-in-progress: false

jobs:
  pure-python-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify Python syntax
        run: python -m compileall -q cfa3_runtime tests
      - name: Verify canonical CFA3 bootstrap guard
        run: python scripts/check_bootstrap.py
      - name: Test desktop-neutral runtime and fail-closed configuration
        run: python -m unittest discover -s tests -p 'test_portable_runtime*.py' -v
      - name: Reference-only evidence guard
        if: always()
        run: echo "Python diagnostics cannot issue physical Current Host or standalone GUI PASS"

  qt6-offscreen-settings:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt graphics loader dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - name: Install Qt6 runtime Python bridge
        run: python -m pip install --disable-pip-version-check "PySide6-Essentials>=6.8,<7"
      - name: Run actual Qt6 settings widget and pref tests
        run: python -m unittest discover -s tests -p 'test_portable_runtime*.py' -v
      - name: Verify noninteractive Qt does not become user runtime-ready
        run: |
          python - <<'PY'
          from cfa3_runtime.qt6_environment import inspect_runtime
          from cfa3_runtime.settings_panel import Qt6RuntimeSettingsPanel
          from PySide6.QtWidgets import QApplication, QWidget
          report = inspect_runtime()
          assert report["status"] == "REFERENCE_ONLY_NO_INTERACTIVE_DISPLAY", report
          assert report["qt_platform"] == "offscreen"
          assert not report["physical_gui_pass"]
          assert not report["parent_integration_gui_pass"]
          app = QApplication([])
          parent = QWidget()
          panel = Qt6RuntimeSettingsPanel(parent, workload_mode="UNKNOWN")
          assert panel.parent() is parent
          assert panel.platform_choice.count() == 3
          assert "UNKNOWN" in panel.workload_mode_indicator.text()
          assert "REFERENCE_ONLY" in panel.status_label.text()
          panel.close()
          parent.close()
          print("Qt6 real widget reference only; no physical GUI admission.")
          PY
      - name: Reference-only GUI evidence guard
        if: always()
        run: echo "A hosted Qt6 offscreen widget is not a physical CFA3 parent GUI PASS"

  rust-developer-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify available Rust/Cargo developer toolchain
        run: |
          rustc --version
          cargo --version
          cargo test --workspace
      - name: Separate developer and end-user requirements
        run: echo "Cargo/Rust is required for building, not for running a packaged CFA3 GUI"

  wheel-install-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build a clean portable-runtime wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/cfa3-wheels" .
          python -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/cfa3-wheels/*.whl
      - name: Verify console entrypoint from outside repository checkout
        run: |
          cd "$RUNNER_TEMP"
          cfa3-runtime developer-tools
          python - <<'PY'
          from importlib.metadata import distribution
          import json
          import subprocess
          from cfa3_runtime.qt6_environment import inspect_developer_tools
          pkg = distribution("cfa3-portable-qt6-runtime")
          console = [e for e in pkg.entry_points
                     if e.group == "console_scripts" and e.name == "cfa3-runtime"]
          assert len(console) == 1, console
          report = inspect_developer_tools()
          assert report["dev_env_ready"] is False
          assert report["end_user_runtime_requires_cargo_or_rustc"] is False
          print("Packaged CLI and dev/runtime separation verified; no physical PASS.")
          PY
      - name: Never advertise a wheel reference as packaged CFA3 distribution
        if: always()
        run: echo "This is a development wheel, not a signed CFA3 installer or physical GUI PASS"

  qt6-x11-xcb-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: xcb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install X11 reference display and Qt6 xcb dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libopengl0 libgl1 \
            libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon-x11-0 \
            libxcb-shape0 libxcb-randr0 libxcb-render0 \
            libxcb-xfixes0 libxcb-sync1 libxcb-xinput0
      - name: Install Qt6 bridge
        run: python -m pip install --disable-pip-version-check "PySide6-Essentials>=6.8,<7"
      - name: Diagnose real Qt6 xcb dependency loading (no admission or bypass)
        run: |
          xvfb-run -a env QT_DEBUG_PLUGINS=1 python - <<'PY'
          from PySide6.QtWidgets import QApplication, QWidget
          app = QApplication([])
          widget = QWidget()
          print("DIAGNOSTIC_XCB_QT_PLATFORM:", app.platformName(), flush=True)
          PY
      - name: Observe actual xcb Qt6 plugin on an Xvfb reference display
        run: |
          xvfb-run -a python - <<'PY'
          from cfa3_runtime.qt6_environment import inspect_runtime
          from cfa3_runtime.launcher import prepare_python_qt_launch
          from cfa3_runtime.preferences import environment_for_next_launch
          import os
          import sys
          report = inspect_runtime()
          assert report["status"] == "APP_RUNTIME_READY", report
          assert report["qt_platform"] == "xcb", report
          assert len(report["screens"]) >= 1, report
          assert report["physical_gui_pass"] is False, report
          assert report["parent_integration_gui_pass"] is False, report
          plan = prepare_python_qt_launch(
              [sys.executable, "-m", "cfa3_runtime", "settings-window"],
              preferences={"schema": "cfa3.runtime-preferences.v1", "qt_platform": "xcb"},
          )
          assert plan.platform == "xcb" and plan.physical_gui_pass is False, plan
          print("Real Qt6 xcb plugin and CFA3 guarded launch observed on Xvfb; physical device GUI PASS is PENDING.")
          PY
      - name: Mount and show actual runtime shell with xcb plugin
        run: xvfb-run -a python -m unittest discover -s tests -p 'test_portable_runtime_parent_app.py' -v
      - name: Hosted X server cannot issue a physical GUI acceptance
        if: always()
        run: echo "Xvfb Qt6 xcb reference only; not the user's physical monitor or full CFA3 parent GUI"

  qt6-wayland-weston-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: wayland
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install independent Wayland compositor and Qt6 graphics dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            weston libegl1 libopengl0 libwayland-client0 libwayland-egl1 \
            libxkbcommon0
          python -m pip install --disable-pip-version-check "PySide6-Essentials>=6.8,<7"
      - name: Start actual headless Weston Wayland compositor and Qt6 GUI
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/cfa3-wayland-run"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=cfa3-weston-0
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" \
            --idle-time=0 --no-config --log="$RUNNER_TEMP/cfa3-weston.log" &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            if ! kill -0 "$weston_pid" 2>/dev/null; then
              tail -n 40 "$RUNNER_TEMP/cfa3-weston.log"
              exit 1
            fi
            sleep 0.2
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" || {
            tail -n 40 "$RUNNER_TEMP/cfa3-weston.log"
            exit 1
          }
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from cfa3_runtime.qt6_environment import inspect_runtime
          from cfa3_runtime.launcher import prepare_python_qt_launch
          from cfa3_runtime.control_center import CFA3RuntimeControlCenter
          from unittest.mock import patch
          import os
          import sys
          report = inspect_runtime()
          assert report["status"] == "APP_RUNTIME_READY", report
          assert report["qt_platform"] == "wayland", report
          assert report["physical_gui_pass"] is False, report
          assert report["parent_integration_gui_pass"] is False, report
          plan = prepare_python_qt_launch(
              [sys.executable, "-m", "cfa3_runtime", "settings-window"],
              preferences={"schema": "cfa3.runtime-preferences.v1", "qt_platform": "wayland"},
          )
          assert plan.platform == "wayland", plan
          app = QApplication([])
          with patch("cfa3_runtime.settings_panel.load_preferences",
                     return_value={"schema": "cfa3.runtime-preferences.v1", "qt_platform": "auto"}):
              shell = CFA3RuntimeControlCenter(workload_mode="UNKNOWN")
          try:
              shell.show()
              app.processEvents()
              assert shell.isVisible()
              assert shell.tabs.widget(0) is shell.settings
              assert shell.settings.window() is shell
              assert "PENDING" in shell.status.text()
          finally:
              shell.close()
          print("Wayland Weston and actual CFA3 Qt6 window visible in headless compositor; physical GUI PASS remains PENDING.")
          PY
      - name: Headless compositor never certifies a physical monitor
        if: always()
        run: echo "Hosted Wayland/Weston success is only a reference, not physical Current Host PASS"
